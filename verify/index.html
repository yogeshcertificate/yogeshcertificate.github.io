<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;text-align:center;padding:30px}
.ok{color:green;font-size:22px;font-weight:bold}
.notfound{color:red;font-size:22px;font-weight:bold}
.box{border:1px solid #333;padding:20px;border-radius:10px;max-width:400px;margin:auto}
</style>
</head>
<body>
<div class="box">
<h2>Certificate Verification</h2>
<p id="status">Checking...</p>
<p><b>Name:</b> <span id="name"></span></p>
<p><b>Course:</b> <span id="course"></span></p>
<p><b>Certificate No:</b> <span id="cert"></span></p>
<p><b>Date:</b> <span id="date"></span></p>
<p><small>yogeshcertificate.github.io</small></p>
</div>
<script>
const DATA = {
"CERT-1": { name:"Rushabh Desai", course:"Tally", date:"11-11-2026" },
"CERT-2": { name:"Kiran Mali", course:"Excel", date:"11-11-2026" },
"CERT-3": { name:"Umesh Karande", course:"MS-Office", date:"11-11-2026" },
"CERT-4": { name:"Chetan Koushik", course:"Tally", date:"11-11-2026" },
"CERT-5": { name:"Vishakha Gavade", course:"Excel", date:"11-11-2026" }
};
const p = new URLSearchParams(location.search);
const id = p.get('id');
const d = DATA[id];
if(d){
document.getElementById('status').textContent = "✅ VERIFIED";
document.getElementById('status').className = "ok";
document.getElementById('name').textContent = d.name;
document.getElementById('course').textContent = d.course;
document.getElementById('cert').textContent = id;
document.getElementById('date').textContent = d.date;
} else {
document.getElementById('status').textContent = "❌ NOT FOUND";
document.getElementById('status').className = "notfound";
}
</script>
</body>
</html>

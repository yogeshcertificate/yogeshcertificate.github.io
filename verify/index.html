<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Verification</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
.card{background:#fff;padding:30px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.1);max-width:450px;width:100%;text-align:center}
.verified{color:#16a34a;font-size:22px;font-weight:bold}
.notfound{color:#dc2626;font-size:22px;font-weight:bold}
.box{background:#f8fafc;padding:15px;border-radius:10px;margin-top:15px;text-align:left}
a{color:#2563eb;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<div id="status">Checking...</div>
<h2 id="name"></h2>
<p id="course"></p>
<p id="date"></p>
<div class="box" id="details" style="display:none">
<p><b>Certificate ID:</b> <span id="certId"></span></p>
<p><b>Course:</b> <span id="course2"></span></p>
<p><b>Date:</b> <span id="date2"></span></p>
<p><b>Status:</b> Valid</p>
</div>
<br>
<a href="https://wa.me/919740997535">WhatsApp: 9740997535</a><br>
<a href="https://yogeshcertificate.github.io">Website</a>
</div>
<script>
const DATA = {
"CERT-1": { name: "Rushabh Desai", course: "Tally", date: "11-11-2026" },
"CERT-2": { name: "Kiran Mali", course: "Excel", date: "11-11-2026" },
"CERT-3": { name: "Umesh Karande", course: "MS-Office", date: "11-11-2026" },
"CERT-4": { name: "Chetan Koushik", course: "Tally", date: "11-11-2026" },
"CERT-5": { name: "Vishakha Gavade", course: "Excel", date: "11-11-2026" },
};
const p = new URLSearchParams(location.search);
const id = (p.get('cert') || p.get('id') || "").toUpperCase().replace(/\s+/g, "");
const d = DATA[id];
if(d){
document.getElementById('name').textContent=d.name;
document.getElementById('course').textContent=d.course;
document.getElementById('date').textContent=d.date;
document.getElementById('certId').textContent=id;
document.getElementById('course2').textContent=d.course;
document.getElementById('date2').textContent=d.date;
document.getElementById('status').textContent="✓ VERIFIED - "+d.name;
document.getElementById('status').className="verified";
document.getElementById('details').style.display="block";
} else {
document.getElementById('status').textContent="✕ Certificate Not Found";
document.getElementById('status').className="notfound";
}
</script>
</body>
</html>

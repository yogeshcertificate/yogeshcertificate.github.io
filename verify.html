<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Certificate</title>
</head>
<body style="font-family:Arial; text-align:center; padding:15px;">
<h2>Yogesh Computer Institute</h2>

<div id="box"></div>

<script>
const students = {
"CERT-1001": ["Rahul kishor", "web developer", "05-11-2026"],
"CERT-1002": ["Pritam Patil", "ms excel", "05-11-2026"],
"CERT-1003": ["Aniket Jadhav", "designer", "05-11-2026"],
"CERT-1004": ["Sneha Deodhar", "Google Space", "05-11-2026"],
"CERT-1005": ["Anil More", "web developer", "05-11-2026"],
"CERT-1006": ["Pooja Pandey", "ms excel", "05-11-2026"],
"CERT-1007": ["Rohan Kale", "Google Space", "05-11-2026"],
"CERT-1008": ["Amruta Shinde", "ms excel", "05-11-2026"],
"CERT-1009": ["Sunil Mane", "web developer", "05-11-2026"],
"CERT-1010": ["Anjana Kamble", "Data Entry", "05-11-2026"]
};

const id = new URLSearchParams(window.location.search).get("id");
const box = document.getElementById("box");

if (id && students[id]) {
  let s = students[id];
  box.innerHTML = `<h1 style="color:green;">✔ VERIFIED</h1><h2>${s[0]}</h2><p>${s[1]}</p><p>CERT ID: ${id}</p><p>Date: ${s[2]}</p>`;
} else {
  let html = `<h3>All Verified Certificates - ${Object.keys(students).length}</h3>`;
  for (let key in students) {
    let s = students[key];
    html += `<div style="border:1px solid #ccc; padding:10px; display:inline-block; width:180px; margin:5px; vertical-align:top;">
    <b>${s[0]}</b><br>${s[1]}<br>${key}<br>
    <a href="?id=${key}">Verify Kara</a>
    </div>`;
  }
  box.innerHTML = html;
}
</script>
</body>
</html>

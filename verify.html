<!DOCTYPE html>
<html>
<head>
<title>Verify Certificate</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;text-align:center;padding:40px}
.box{border:2px solid #0A2342;padding:30px;max-width:500px;margin:auto;border-radius:10px}
h1{color:#0A2342}
.ok{color:green;font-size:22px;font-weight:bold}
.no{color:red;font-size:22px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h1>Certificate Verification</h1>
<div id="result">Checking...</div>
</div>
<script>
const students = {
"CERT-1": ["Amit Sharma", "Excel Automation", "26-10-2026"],
"CERT-2": ["Priya Desai", "QR certificate", "25-10-2026"],
"CERT-3": ["Sneha Kulkarni", "Google Form", "26-10-2026"],
"CERT-4": ["Rahul Patil", "Excel Automation", "27-10-2026"],
"CERT-5": ["Vikram Joshi", "QR certificate", "28-10-2026"],
"CERT-6": ["Anjali Mehta", "Google Form", "29-10-2026"],
"CERT-7": ["Rohan Pawar", "Excel Automation", "30-10-2026"],
"CERT-8": ["Pooja Singh", "QR certificate", "31-10-2026"],
"CERT-9": ["Kiran Jadhav", "Google Form", "01-11-2026"],
"CERT-10": ["Neha More", "Excel Automation", "02-11-2026"]
};
const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const r = document.getElementById("result");
if(students[id]){
  r.innerHTML = `<p class="ok">✅ VERIFIED</p><p><b>Name:</b> ${students[id][0]}</p><p><b>Course:</b> ${students[id][1]}</p><p><b>Date:</b> ${students[id][2]}</p><p><b>ID:</b> ${id}</p>`;
} else {
  r.innerHTML = `<p class="no">❌ INVALID CERTIFICATE</p><p>ID: ${id}</p>`;
}
</script>
</body>
</html>
